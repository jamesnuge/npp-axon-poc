version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: axon-postgres
    restart: always
    environment:
      POSTGRES_DB: npp_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: